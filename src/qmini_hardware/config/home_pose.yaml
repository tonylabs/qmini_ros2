# Qmini home / standing pose [rad, joint-side], canonical joint order.
#
# Copied VERBATIM from the authoritative Isaac Lab source:
#   qmini_isaaclab/source/Qmini/robots/qmini.py  ->  init_state.joint_pos
# (the mirrored bipedal crouch). This is also the policy's default offset: the
# on-robot action is  q_des = home_pose + 0.5 * onnx_output  (action scale 0.5,
# use_default_offset=True). If qmini.py changes, change this file to match it
# (never the other way round).
#
# Lives in qmini_hardware/config (not qmini_controllers) per project decision
# 2026-05-25 — kept alongside the other per-robot hardware config
# (motor_layout.yaml, joint_offsets.yaml). The controller loads it via the
# home_pose_file parameter.
#
# NOTE: only meaningful AFTER homing (see docs/HOMING.md). These are absolute
# joint angles in the zero-referenced frame; with uncalibrated offsets they
# point at the wrong physical pose.
home_pose:
  hip_yaw_l:      0.4
  hip_roll_l:    -0.1
  hip_pitch_l:   -1.5
  knee_pitch_l:   1.0
  ankle_pitch_l: -1.3
  hip_yaw_r:     -0.4
  hip_roll_r:     0.1
  hip_pitch_r:    1.5
  knee_pitch_r:  -1.0
  ankle_pitch_r:  1.3
